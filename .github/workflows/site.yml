name: Results page

on:
  push:
    branches: [main]
    paths:
      - "results/**"
      - "items.jsonl"
      - "tools/site.py"
      - "tools/issues.py"
      - "known.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:
  # Pull request and issue states change without new results, so refresh every day.
  schedule:
    # Hourly, so issue and PR states upstream (fixes merging, issues closing) show without anyone asking (2026-11-17).
    - cron: "17 * * * *"
  # A merge by the bot's token starts no push workflows, so also run after each bot merge.
  workflow_run:
    workflows: ["Merge results"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep the last issue data as a fallback
        run: curl -fsS -o site/issues.json https://dutchmancad.xyz/stress-corpus/issues.json || true
      - name: Read issue and pull request states
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/issues.py
      - name: Build the page
        run: python3 tools/site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
