name: Claim a batch

# Comment "/claim" (or "claiming") on a batch issue to be assigned to it; "/unclaim" to give it back.
# GitHub lets anyone who has commented on an issue be assigned to it, so no repo access is needed.
on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  claim:
    if: ${{ !github.event.issue.pull_request && contains(github.event.issue.labels.*.name, 'batch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim().toLowerCase();
            const user = context.payload.comment.user.login;
            const issue = context.payload.issue;
            const ref = { owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number };
            const say = (text) => github.rest.issues.createComment({ ...ref, body: text });
            const assignees = issue.assignees.map((a) => a.login);
            if (/^(\/claim|claiming)\b/.test(body)) {
              if (assignees.includes(user)) return;
              if (assignees.length > 0) {
                await say(`This batch is already claimed by @${assignees[0]}. Pick another open batch without an assignee.`);
                return;
              }
              const { data: open } = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo, labels: 'batch', state: 'open', assignee: user, per_page: 10,
              });
              if (open.length >= 2) {
                await say(`@${user}, you already hold ${open.length} open batches (${open.map((i) => '#' + i.number).join(', ')}). Close one before claiming another.`);
                return;
              }
              await github.rest.issues.addAssignees({ ...ref, assignees: [user] });
              await github.rest.reactions.createForIssueComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: context.payload.comment.id, content: '+1' });
            } else if (/^(\/unclaim|unclaiming)\b/.test(body) && assignees.includes(user)) {
              await github.rest.issues.removeAssignees({ ...ref, assignees: [user] });
              await github.rest.reactions.createForIssueComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: context.payload.comment.id, content: '+1' });
            }
